<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar">
                    <div class="avatar-placeholder">头像</div>
                </div>
                <h1 class="site-title">我的博客</h1>
                <p class="bio">欢迎来到我的个人空间</p>
            </div>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="#" data-view="home" class="nav-link active">首页</a></li>
                    <li><a href="#" data-view="articles" class="nav-link">文章</a></li>
                    <li><a href="#" data-view="projects" class="nav-link">项目</a></li>
                </ul>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <main class="content">
            <!-- 首页视图 -->
            <section id="home-view" class="view active">
                <h2 class="section-title">最新文章</h2>
                <div id="latest-articles" class="article-list"></div>
                
                <h2 class="section-title">项目展示</h2>
                <div id="latest-projects" class="project-list"></div>
            </section>

            <!-- 文章列表视图 -->
            <section id="articles-view" class="view">
                <h2 class="section-title">全部文章</h2>
                <div id="all-articles" class="article-list"></div>
            </section>

            <!-- 项目视图 -->
            <section id="projects-view" class="view">
                <h2 class="section-title">项目分类</h2>
                <div class="projects-container">
                    <div id="project-categories" class="project-categories"></div>
                    <div id="project-detail" class="project-detail"></div>
                </div>
            </section>

            <!-- 文章阅读视图 -->
            <section id="article-view" class="view">
                <button id="back-to-list" class="back-btn">返回列表</button>
                <article id="article-content" class="article-content"></article>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
